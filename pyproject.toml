[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "valheimworldcheatflagcleaner"
version = "1.0.0"
description = "Tools for inspecting cheat flags in character saves and repairing markers in Valheim worlds."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
valheim-cheat-flag-cleaner = "valheim_cheat_flag_cleaner.valheim_cheat_cleaner:main"

[tool.setuptools.packages.find]
where = ["src"]
